<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AI Agent Skill Store</title>
  <meta name="theme-color" content="#081018" />
  <style>
    :root {
      --bg: #071018;
      --bg-soft: #0b1620;
      --panel: #0d1823;
      --panel-2: #101d2a;
      --line: #173142;
      --line-strong: #1ee7c7;
      --text: #e9f7ff;
      --muted: #7f9aac;
      --green: #22d3a6;
      --green-soft: rgba(34, 211, 166, 0.12);
      --red: #ff6b6b;
      --red-soft: rgba(255, 107, 107, 0.12);
      --yellow: #ffd166;
      --cyan: #2df1d0;
      --purple: #8b7bff;
      --chip: #1a2740;
      --shadow: 0 0 0 1px rgba(45, 241, 208, 0.08), 0 8px 30px rgba(0, 0, 0, 0.35);
      --radius: 16px;
      --header-h: 64px;
      --mobile-nav-h: 60px;
      --chat-input-h: 82px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #060c12 0%, #081018 100%);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top right, rgba(45, 241, 208, 0.07), transparent 25%),
        radial-gradient(circle at top left, rgba(139, 123, 255, 0.08), transparent 30%),
        linear-gradient(180deg, #071018 0%, #081018 100%);
    }

    .topbar {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 12, 18, 0.92);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--line-strong);
      text-shadow: 0 0 16px rgba(30, 231, 199, 0.18);
      white-space: nowrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 10px rgba(34, 211, 166, 0.7);
      flex-shrink: 0;
    }

    .status-text {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .pill strong {
      color: var(--cyan);
      font-weight: 700;
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 320px;
    }

    .panel {
      min-height: 0;
      border-right: 1px solid var(--line);
      background: rgba(8, 16, 24, 0.7);
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-inner {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 13px;
      color: var(--cyan);
      letter-spacing: 1px;
      font-weight: 700;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
    }

    .skills-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .skill-card {
      background: linear-gradient(180deg, rgba(10, 25, 33, 0.95), rgba(10, 25, 33, 0.82));
      border: 1px solid rgba(30, 231, 199, 0.55);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .skill-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .skill-name {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      color: #f2fbff;
      word-break: break-word;
    }

    .skill-desc {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .skill-badge {
      flex-shrink: 0;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(34, 211, 166, 0.26);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .skill-badge.off {
      background: rgba(255, 107, 107, 0.12);
      color: var(--red);
      border-color: rgba(255, 107, 107, 0.24);
    }

    .skill-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .chip {
      background: #2a245a;
      color: #cdbbff;
      border: 1px solid rgba(205, 187, 255, 0.14);
      border-radius: 10px;
      font-size: 12px;
      padding: 7px 10px;
      word-break: break-word;
    }

    .skill-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.18s ease;
      font-size: 13px;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
    }

    .btn-primary {
      background: linear-gradient(180deg, #10cfa9, #08b692);
      color: #03251d;
      border: none;
      font-weight: 800;
    }

    .btn-danger {
      border-color: rgba(255, 107, 107, 0.35);
      color: #ff8f8f;
      background: rgba(255, 107, 107, 0.08);
    }

    .btn-muted {
      color: var(--muted);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 10px;
    }

    .panel-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chat-wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-state {
      margin: auto;
      max-width: 640px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
      padding: 24px;
    }

    .empty-title {
      color: var(--cyan);
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 88%;
    }

    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.assistant,
    .msg.system {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-meta {
      font-size: 11px;
      color: var(--muted);
      padding: 0 4px;
    }

    .bubble {
      border-radius: 16px;
      padding: 14px 14px;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: linear-gradient(180deg, rgba(16, 207, 169, 0.22), rgba(16, 207, 169, 0.12));
      border: 1px solid rgba(16, 207, 169, 0.28);
    }

    .assistant .bubble {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
    }

    .system .bubble {
      background: rgba(139, 123, 255, 0.12);
      border: 1px solid rgba(139, 123, 255, 0.2);
      color: #d8d0ff;
    }

    .steps-box {
      margin-top: 8px;
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 10px;
    }

    .step-item {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(127, 154, 172, 0.12);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .step-item:last-child {
      border-bottom: none;
    }

    .chat-input-wrap {
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
      background: rgba(6, 14, 21, 0.92);
      flex-shrink: 0;
    }

    .chat-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .chat-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
      min-height: 52px;
    }

    .chat-input {
      width: 100%;
      min-height: 54px;
      max-height: 180px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .send-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
    }

    .logs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .log-row {
      border-bottom: 1px dashed rgba(127, 154, 172, 0.15);
      padding-bottom: 10px;
    }

    .log-time {
      color: #7f9aac;
      font-size: 12px;
    }

    .log-text {
      color: #cfe8f6;
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      padding: 14px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      color: var(--cyan);
      margin-bottom: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .inline-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field,
    .textarea {
      width: 100%;
      background: #09131b;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 12px;
      outline: none;
    }

    .textarea {
      min-height: 110px;
      resize: vertical;
    }

    .mini-note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .hidden-desktop {
      display: none;
    }

    .mobile-sheet {
      display: none;
    }

    .mobile-nav {
      display: none;
    }

    .toast-wrap {
      position: fixed;
      right: 14px;
      top: 76px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      min-width: 240px;
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(7, 16, 24, 0.96);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: 13px;
      line-height: 1.5;
    }

    .toast.success {
      border-color: rgba(34, 211, 166, 0.35);
    }

    .toast.error {
      border-color: rgba(255, 107, 107, 0.35);
      color: #ffd4d4;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 280px minmax(0, 1fr) 280px;
      }
    }

    @media (max-width: 900px) {
      body {
        overflow: hidden;
      }

      .topbar {
        padding: 0 12px;
      }

      .logo {
        font-size: 16px;
      }

      .status-text {
        display: none;
      }

      .pill {
        padding: 7px 9px;
        font-size: 11px;
      }

      .layout {
        display: block;
        position: relative;
      }

      .panel-left,
      .panel-right {
        display: none;
      }

      .panel-center {
        border-right: none;
        height: calc(100vh - var(--header-h));
      }

      .panel-center .panel-head {
        display: none;
      }

      .chat-wrap {
        height: calc(100vh - var(--header-h));
      }

      .chat-messages {
        padding: 14px 12px;
        padding-bottom: 18px;
      }

      .msg {
        max-width: 95%;
      }

      .chat-input-wrap {
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
      }

      .chat-form {
        grid-template-columns: 1fr;
      }

      .send-col {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .desktop-only {
        display: none !important;
      }

      .hidden-desktop {
        display: block;
      }

      .mobile-sheet {
        position: fixed;
        left: 0;
        right: 0;
        top: var(--header-h);
        bottom: var(--mobile-nav-h);
        background: rgba(4, 10, 15, 0.98);
        z-index: 50;
        overflow: auto;
        padding: 14px;
        display: none;
      }

      .mobile-sheet.active {
        display: block;
      }

      .mobile-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(var(--mobile-nav-h) + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1.2fr;
        background: rgba(8, 16, 24, 0.98);
        border-top: 1px solid var(--line);
        z-index: 60;
      }

      .mobile-nav button {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
      }

      .mobile-nav button.active {
        color: var(--cyan);
      }

      .mobile-nav .run-btn {
        color: #031f18;
        background: linear-gradient(180deg, #16d7b0, #08c49d);
        font-weight: 800;
      }

      .toast-wrap {
        left: 10px;
        right: 10px;
        top: 72px;
      }

      .toast {
        min-width: 0;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">AI-AGENT</div>
        <div class="status-dot"></div>
        <div class="status-text">online</div>
      </div>
      <div class="topbar-right">
        <div class="pill"><strong id="skillCount">0</strong> skills active</div>
        <div class="pill">session: <strong id="sessionBadge">default</strong></div>
      </div>
    </header>

    <main class="layout">
      <!-- LEFT / SKILLS -->
      <section class="panel panel-left desktop-only">
        <div class="panel-inner">
          <div class="panel-head">
            <div class="panel-title">SKILL STORE</div>
            <div class="panel-tools">
              <button class="btn btn-small" onclick="refreshSkills()">Refresh</button>
            </div>
          </div>

          <div class="panel-body">
            <div class="section">
              <div class="section-title">INSTALL FROM URL</div>
              <div class="inline-form">
                <input id="installName" class="field" placeholder="Skill name" />
                <input id="installUrl" class="field" placeholder="https://.../skill-folder" />
                <button class="btn btn-primary" onclick="installSkillFromUrl()">Install Skill</button>
                <div class="mini-note">會呼叫 <code>/api/skills/install</code></div>
              </div>
            </div>

            <div id="skillsList" class="skills-list"></div>
          </div>
        </div>
      </section>

      <!-- CENTER / CHAT -->
      <section class="panel panel-center">
        <div class="panel-inner">
          <div class="panel-head desktop-only">
            <div class="panel-title">CHAT</div>
            <div class="panel-tools">
              <button class="btn btn-small" onclick="clearChat()">Clear</button>
            </div>
          </div>

          <div class="chat-wrap">
            <div id="chatMessages" class="chat-messages">
              <div class="empty-state" id="emptyState">
                <div class="empty-title">Run your AI Agent</div>
                <div>直接輸入需求，系統會透過 <code>/api/chat</code> 呼叫後端，並在需要時使用已啟用的 skills。</div>
              </div>
            </div>

            <div class="chat-input-wrap">
              <form class="chat-form" onsubmit="submitChat(event)">
                <div class="chat-box">
                  <textarea
                    id="chatInput"
                    class="chat-input"
                    placeholder="輸入訊息，例如：幫我搜尋今天比特幣的重要消息，然後總結重點"
                    oninput="autoResize(this)"
                  ></textarea>
                </div>
                <div class="send-col">
                  <button id="sendBtn" class="btn btn-primary" type="submit">Run AI</button>
                  <div class="hint">Enter 送出，Shift+Enter 換行</div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT / LOGS -->
      <section class="panel panel-right desktop-only">
        <div class="panel-inner">
          <div class="panel-head">
            <div class="panel-title">LOGS</div>
            <div class="panel-tools">
              <button class="btn btn-small" onclick="clearLogs()">Clear</button>
            </div>
          </div>

          <div class="panel-body">
            <div id="logsList" class="logs-list"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- MOBILE SHEETS -->
    <div id="mobile-skills" class="mobile-sheet">
      <div class="section">
        <div class="section-title">INSTALL FROM URL</div>
        <div class="inline-form">
          <input id="mInstallName" class="field" placeholder="Skill name" />
          <input id="mInstallUrl" class="field" placeholder="https://.../skill-folder" />
          <button class="btn btn-primary" onclick="installSkillFromUrl(true)">Install Skill</button>
        </div>
      </div>

      <div id="mobileSkillsList" class="skills-list"></div>
    </div>

    <div id="mobile-logs" class="mobile-sheet">
      <div class="section">
        <div class="section-title">SYSTEM LOGS</div>
        <div id="mobileLogsList" class="logs-list"></div>
      </div>
    </div>

    <nav class="mobile-nav hidden-desktop">
      <button id="navChat" class="active" onclick="showMobileView('chat')">Chat</button>
      <button id="navSkills" onclick="showMobileView('skills')">Store</button>
      <button id="navLogs" onclick="showMobileView('logs')">Logs</button>
      <button class="run-btn" onclick="focusChat()">Run AI</button>
    </nav>
  </div>

  <div id="toastWrap" class="toast-wrap"></div>

  <script>
    const state = {
      sessionId: localStorage.getItem("ai_agent_session_id") || "default",
      chatHistory: [],
      skills: [],
      logs: [],
      currentMobileView: "chat",
      busy: false,
    };

    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const skillCount = document.getElementById("skillCount");
    const sessionBadge = document.getElementById("sessionBadge");
    const skillsList = document.getElementById("skillsList");
    const mobileSkillsList = document.getElementById("mobileSkillsList");
    const logsList = document.getElementById("logsList");
    const mobileLogsList = document.getElementById("mobileLogsList");
    const emptyState = document.getElementById("emptyState");

    sessionBadge.textContent = state.sessionId;

    function nowTime() {
      const d = new Date();
      return d.toLocaleTimeString("zh-TW", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function addLog(text, level = "info") {
      const row = {
        time: nowTime(),
        text,
        level,
      };
      state.logs.unshift(row);
      state.logs = state.logs.slice(0, 200);
      renderLogs();
    }

    function clearLogs() {
      state.logs = [];
      renderLogs();
      addLog("Logs cleared");
    }

    function renderLogs() {
      const html = state.logs.map(log => `
        <div class="log-row">
          <div class="log-time">[${escapeHtml(log.time)}]</div>
          <div class="log-text">${escapeHtml(log.text)}</div>
        </div>
      `).join("");

      logsList.innerHTML = html || `<div class="mini-note">尚無 logs</div>`;
      mobileLogsList.innerHTML = html || `<div class="mini-note">尚無 logs</div>`;
    }

    function showToast(message, type = "success") {
      const wrap = document.getElementById("toastWrap");
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = message;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(-4px)";
      }, 2200);
      setTimeout(() => {
        el.remove();
      }, 2600);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatText(text) {
      return escapeHtml(text).replace(/\n/g, "<br>");
    }

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 180) + "px";
    }

    function setBusy(v) {
      state.busy = v;
      sendBtn.disabled = v;
      sendBtn.textContent = v ? "Running..." : "Run AI";
    }

    function addMessage(role, text, steps = null) {
      if (emptyState) {
        emptyState.style.display = "none";
      }

      const wrapper = document.createElement("div");
      wrapper.className = `msg ${role}`;

      const label = role === "user" ? "You" : role === "assistant" ? "Agent" : "System";

      let stepsHtml = "";
      if (Array.isArray(steps) && steps.length) {
        stepsHtml = `
          <div class="steps-box">
            ${steps.map(step => `
              <div class="step-item">
                ${escapeHtml(step.type || "step")}
                ${step.tool ? " · " + escapeHtml(step.tool) : ""}
                ${step.content ? "\n" + escapeHtml(step.content) : ""}
                ${step.result ? "\n" + escapeHtml(String(step.result)) : ""}
              </div>
            `).join("")}
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="msg-meta">${escapeHtml(label)} · ${escapeHtml(nowTime())}</div>
        <div class="bubble">${formatText(text)}</div>
        ${stepsHtml}
      `;

      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function clearChat() {
      state.chatHistory = [];
      chatMessages.innerHTML = `
        <div class="empty-state" id="emptyState">
          <div class="empty-title">Run your AI Agent</div>
          <div>直接輸入需求，系統會透過 <code>/api/chat</code> 呼叫後端，並在需要時使用已啟用的 skills。</div>
        </div>
      `;
      addLog("Chat cleared");
    }

    async function refreshSkills() {
      addLog("Loading skills...");
      try {
        const res = await fetch("/api/skills");
        const data = await res.json();
        state.skills = Array.isArray(data.skills) ? data.skills : [];
        renderSkills();
        skillCount.textContent = state.skills.filter(s => s.enabled).length;
        addLog(`Loaded ${state.skills.length} skills`);
      } catch (err) {
        console.error(err);
        addLog(`Load skills failed: ${err}`, "error");
        showToast("載入 skills 失敗", "error");
      }
    }

    function renderSkills() {
      const html = state.skills.map(skill => {
        const enabled = !!skill.enabled;
        const toggleLabel = enabled ? "Disable" : "Enable";
        const badgeClass = enabled ? "skill-badge" : "skill-badge off";
        const badgeText = enabled ? "ON" : "OFF";
        const tools = Array.isArray(skill.tools) ? skill.tools : [];

        return `
          <div class="skill-card">
            <div class="skill-top">
              <div>
                <div class="skill-name">${escapeHtml(skill.name || "unnamed")}</div>
                <div class="skill-desc">${escapeHtml(skill.description || "")}</div>
              </div>
              <div class="${badgeClass}">${badgeText}</div>
            </div>

            <div class="skill-tools">
              ${tools.length
                ? tools.map(t => `<div class="chip">${escapeHtml(t)}</div>`).join("")
                : `<div class="mini-note">No tools</div>`
              }
            </div>

            <div class="skill-actions">
              <button class="btn btn-muted" onclick="toggleSkill('${encodeURIComponent(skill.name)}')">${toggleLabel}</button>
              <button class="btn btn-danger" onclick="removeSkill('${encodeURIComponent(skill.name)}')">Remove</button>
            </div>
          </div>
        `;
      }).join("");

      skillsList.innerHTML = html || `<div class="mini-note">沒有 skills</div>`;
      mobileSkillsList.innerHTML = html || `<div class="mini-note">沒有 skills</div>`;
    }

    async function toggleSkill(encodedName) {
      const name = decodeURIComponent(encodedName);
      addLog(`Toggling skill: ${name}`);
      try {
        const res = await fetch(`/api/skills/${encodeURIComponent(name)}/toggle`, {
          method: "PATCH"
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Toggle failed");
        }
        showToast(`${name} 已切換`, "success");
        addLog(`Toggled skill: ${name}`);
        await refreshSkills();
      } catch (err) {
        console.error(err);
        addLog(`Toggle failed: ${name} - ${err}`, "error");
        showToast(`切換失敗：${name}`, "error");
      }
    }

    async function removeSkill(encodedName) {
      const name = decodeURIComponent(encodedName);
      const ok = confirm(`確定要移除 skill：${name}？`);
      if (!ok) return;

      addLog(`Removing skill: ${name}`);
      try {
        const res = await fetch(`/api/skills/${encodeURIComponent(name)}`, {
          method: "DELETE"
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Remove failed");
        }
        showToast(`${name} 已移除`, "success");
        addLog(`Removed skill: ${name}`);
        await refreshSkills();
      } catch (err) {
        console.error(err);
        addLog(`Remove failed: ${name} - ${err}`, "error");
        showToast(`移除失敗：${name}`, "error");
      }
    }

    async function installSkillFromUrl(isMobile = false) {
      const nameEl = isMobile ? document.getElementById("mInstallName") : document.getElementById("installName");
      const urlEl = isMobile ? document.getElementById("mInstallUrl") : document.getElementById("installUrl");

      const name = nameEl.value.trim();
      const url = urlEl.value.trim();

      if (!name || !url) {
        showToast("請輸入 skill name 和 URL", "error");
        return;
      }

      addLog(`Installing skill from URL: ${name}`);
      try {
        const res = await fetch("/api/skills/install", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, url })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || data.message || "Install failed");
        }

        showToast(`已安裝 ${name}`, "success");
        addLog(`Installed skill: ${name}`);
        nameEl.value = "";
        urlEl.value = "";
        await refreshSkills();
      } catch (err) {
        console.error(err);
        addLog(`Install failed: ${name} - ${err}`, "error");
        showToast(`安裝失敗：${name}`, "error");
      }
    }

    async function submitChat(event) {
      event.preventDefault();
      if (state.busy) return;

      const text = chatInput.value.trim();
      if (!text) return;

      addMessage("user", text);
      addLog(`User message sent`);
      state.chatHistory.push({ role: "user", content: text });

      chatInput.value = "";
      autoResize(chatInput);
      setBusy(true);

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            session_id: state.sessionId,
            history: []
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || data.detail || "Chat request failed");
        }

        const reply = data.response || "已完成，但沒有文字回應。";
        addMessage("assistant", reply, data.steps || []);
        addLog(`Agent replied`);

        if (Array.isArray(data.steps)) {
          const toolCalls = data.steps.filter(s => s.type === "tool_call");
          if (toolCalls.length) {
            addLog(`Used ${toolCalls.length} tool call(s)`);
          }
        }
      } catch (err) {
        console.error(err);
        addMessage("system", `發生錯誤：${err}`);
        addLog(`Chat failed: ${err}`, "error");
        showToast("聊天請求失敗", "error");
      } finally {
        setBusy(false);
      }
    }

    function showMobileView(view) {
      state.currentMobileView = view;

      const skills = document.getElementById("mobile-skills");
      const logs = document.getElementById("mobile-logs");

      skills.classList.remove("active");
      logs.classList.remove("active");

      document.getElementById("navChat").classList.remove("active");
      document.getElementById("navSkills").classList.remove("active");
      document.getElementById("navLogs").classList.remove("active");

      if (view === "skills") {
        skills.classList.add("active");
        document.getElementById("navSkills").classList.add("active");
      } else if (view === "logs") {
        logs.classList.add("active");
        document.getElementById("navLogs").classList.add("active");
      } else {
        document.getElementById("navChat").classList.add("active");
      }
    }

    function focusChat() {
      showMobileView("chat");
      chatInput.focus();
    }

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.querySelector(".chat-form").requestSubmit();
      }
    });

    async function bootstrap() {
      addLog("Agent UI started");
      await refreshSkills();
      renderLogs();
      showMobileView("chat");
      autoResize(chatInput);
    }

    bootstrap();
  </script>
</body>
</html>
