<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AI Fund Control Panel</title>
  <meta name="theme-color" content="#071018" />
  <style>
    :root{
      --bg:#071018;
      --panel:#0c1722;
      --line:#183446;
      --cyan:#25e4c6;
      --cyan2:#18c8aa;
      --text:#e8f7ff;
      --muted:#7f9aac;
      --danger:#ff7373;
      --ok:#23d3a6;
      --warn:#ffd166;
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;
      background:linear-gradient(180deg,#060c12,#081018);
      color:var(--text);
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      height:100%;
    }
    body{overflow:hidden}
    .app{
      height:100vh;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      height:64px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      background:rgba(5,12,18,.95);
      flex-shrink:0;
    }
    .brand{
      display:flex;align-items:center;gap:12px;
      min-width:0;
    }
    .logo{
      color:var(--cyan);
      font-weight:900;
      font-size:18px;
      letter-spacing:1px;
      white-space:nowrap;
    }
    .dot{
      width:11px;height:11px;border-radius:999px;background:var(--ok);
      box-shadow:0 0 10px rgba(35,211,166,.7);
      flex-shrink:0;
    }
    .pill{
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 12px;
      color:var(--muted);
      background:rgba(11,22,32,.9);
      font-size:12px;
      white-space:nowrap;
    }
    .pill strong{color:var(--cyan)}
    .topbar-right{
      display:flex;gap:8px;align-items:center;
    }

    .provider-bar{
      display:flex;gap:8px;flex-wrap:wrap;
      padding:10px 14px;
      border-bottom:1px solid var(--line);
      background:rgba(8,16,24,.85);
      flex-shrink:0;
    }
    .provider-pill{
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      background:#0a141d;
      color:var(--muted);
    }
    .provider-pill.ok{border-color:rgba(35,211,166,.35);color:#baf6ea}
    .provider-pill.err{border-color:rgba(255,115,115,.35);color:#ffd2d2}

    .layout{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns:320px minmax(0,1fr) 320px;
    }
    .panel{
      min-height:0;
      border-right:1px solid var(--line);
      background:rgba(8,16,24,.6);
      display:flex;
      flex-direction:column;
    }
    .panel:last-child{border-right:none}
    .panel-head{
      padding:14px;
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;
      flex-shrink:0;
    }
    .panel-title{
      color:var(--cyan);
      font-weight:700;
      letter-spacing:1px;
      font-size:13px;
    }
    .panel-body{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:14px;
    }

    .section{
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.02);
      padding:14px;
      margin-bottom:14px;
    }
    .section-title{
      color:var(--cyan);
      font-size:12px;
      font-weight:700;
      margin-bottom:10px;
      letter-spacing:1px;
    }

    .field{
      width:100%;
      border:1px solid var(--line);
      background:#08131d;
      color:var(--text);
      border-radius:14px;
      padding:14px;
      outline:none;
      margin-bottom:10px;
      font-size:14px;
    }

    .btn{
      border:1px solid var(--line);
      background:#0e1b27;
      color:var(--text);
      border-radius:12px;
      padding:10px 14px;
      cursor:pointer;
      font-size:13px;
    }
    .btn:hover{border-color:var(--cyan)}
    .btn-primary{
      background:linear-gradient(180deg,#1dd7b0,#11c4a0);
      color:#06251f;
      border:none;
      font-weight:800;
    }
    .btn-danger{
      background:rgba(255,115,115,.08);
      color:#ff9c9c;
      border-color:rgba(255,115,115,.28);
    }
    .btn-row{display:flex;gap:10px;flex-wrap:wrap}

    .quick-actions{
      padding:10px 14px;
      border-bottom:1px solid var(--line);
      display:flex;gap:8px;flex-wrap:wrap;
      background:rgba(7,14,21,.9);
      flex-shrink:0;
    }

    .plugin-card{
      border:1px solid rgba(37,228,198,.45);
      border-radius:18px;
      padding:14px;
      background:linear-gradient(180deg,rgba(7,24,33,.95),rgba(7,24,33,.72));
      margin-bottom:14px;
    }
    .plugin-top{
      display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
    }
    .plugin-name{
      font-size:15px;font-weight:900;color:#f1fbff;
    }
    .plugin-desc{
      color:var(--muted);font-size:13px;line-height:1.5;margin-top:8px;
    }
    .badge{
      border:1px solid rgba(35,211,166,.3);
      color:var(--ok);
      background:rgba(35,211,166,.08);
      border-radius:12px;
      padding:7px 10px;
      font-size:12px;
      font-weight:800;
      flex-shrink:0;
    }
    .badge.off{
      border-color:rgba(255,115,115,.28);
      color:#ff9c9c;
      background:rgba(255,115,115,.08);
    }
    .chips{
      display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;
    }
    .chip{
      background:#2d2459;
      color:#d3c6ff;
      border:1px solid rgba(211,198,255,.15);
      border-radius:10px;
      font-size:12px;
      padding:7px 10px;
    }
    .plugin-actions{
      display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;
    }

    .terminal{
      display:flex;
      flex-direction:column;
      height:100%;
      min-height:0;
    }
    .terminal-output{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:16px;
    }
    .terminal-line{
      white-space:pre-wrap;
      word-break:break-word;
      line-height:1.7;
      margin-bottom:10px;
      color:#d8eefc;
    }
    .terminal-line.cmd{color:#b8fff0}
    .terminal-line.info{color:#d8eefc}
    .terminal-line.warn{color:#ffe09c}
    .terminal-line.err{color:#ffb4b4}
    .terminal-line.dim{color:var(--muted)}
    .terminal-block{
      border:1px dashed rgba(127,154,172,.18);
      border-radius:14px;
      padding:12px;
      margin:10px 0 16px;
      background:rgba(255,255,255,.01);
    }
    .terminal-input-wrap{
      border-top:1px solid var(--line);
      padding:12px;
      background:rgba(7,14,21,.92);
      flex-shrink:0;
    }
    .terminal-bar{
      display:flex;gap:10px;align-items:center;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      background:#08131d;
    }
    .prompt{
      color:var(--cyan);
      font-weight:900;
      flex-shrink:0;
    }
    .terminal-input{
      flex:1;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-family:inherit;
      font-size:14px;
    }

    .logs-list .log-row{
      border-bottom:1px dashed rgba(127,154,172,.14);
      padding-bottom:10px;
      margin-bottom:10px;
    }
    .logs-list .time{color:var(--muted);font-size:12px}
    .logs-list .text{color:#d7eef8;font-size:13px;line-height:1.55;margin-top:4px;white-space:pre-wrap}

    .env-block{
      background:#020617;
      border:1px solid rgba(37,228,198,.16);
      border-radius:12px;
      padding:12px;
      color:#d9f7ff;
      font-size:12px;
      white-space:pre-wrap;
      word-break:break-word;
      line-height:1.6;
      min-height:72px;
    }
    .stats-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }
    .stat{
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      background:#08131d;
    }
    .stat-label{
      color:var(--muted);
      font-size:11px;
      margin-bottom:4px;
    }
    .stat-value{
      color:var(--text);
      font-size:14px;
      font-weight:800;
    }

    .mobile-nav{
      display:none;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      display:none;
      z-index:999;
    }
    .modal-card{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:92%;
      max-width:520px;
      background:#0c1722;
      border:1px solid var(--line);
      border-radius:18px;
      padding:20px;
    }

    @media (max-width: 900px){
      .layout{
        grid-template-columns:1fr;
      }
      .panel-left,.panel-right{
        display:none;
      }
      .provider-bar{
        padding:8px 10px;
      }
      .topbar{
        padding:0 10px;
      }
      .logo{font-size:16px}
      .mobile-nav{
        display:grid;
        grid-template-columns:1fr 1fr 1fr 1.2fr;
        height:60px;
        border-top:1px solid var(--line);
        background:rgba(8,16,24,.98);
        position:fixed;
        left:0;right:0;bottom:0;
        z-index:50;
      }
      .mobile-nav button{
        border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;
      }
      .mobile-nav .run{
        background:linear-gradient(180deg,#1dd7b0,#11c4a0);
        color:#06251f;font-weight:900;
      }
      .terminal{
        padding-bottom:60px;
      }
      .quick-actions{
        overflow-x:auto;
        white-space:nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">AI-FUND</div>
        <div class="dot"></div>
      </div>
      <div class="topbar-right">
        <div class="pill"><strong id="pluginCount">0</strong> plugins active</div>
        <div class="pill">session: <strong id="sessionBadge">default</strong></div>
      </div>
    </header>

    <div class="provider-bar">
      <div id="claudeStatus" class="provider-pill">Claude: checking...</div>
      <div id="openaiStatus" class="provider-pill">GPT: checking...</div>
      <div id="tradingStatus" class="provider-pill">Trading: checking...</div>
      <button class="btn" onclick="refreshProviderStatus()">Check APIs</button>
    </div>

    <main class="layout">
      <section class="panel panel-left">
        <div class="panel-head">
          <div class="panel-title">PLUGIN STORE</div>
          <button class="btn" onclick="refreshPlugins()">Refresh</button>
        </div>
        <div class="panel-body">
          <div class="section">
            <div class="section-title">INSTALL FROM URL</div>
            <input id="installName" class="field" placeholder="Plugin name" />
            <input id="installUrl" class="field" placeholder="https://.../plugin-folder" />
            <button class="btn btn-primary" style="width:100%" onclick="installPluginFromUrl()">Install Plugin</button>
          </div>

          <div class="section">
            <div class="section-title">ENV OPTIMIZER</div>
            <div class="btn-row">
              <button class="btn btn-primary" onclick="runQuick('/auto_opt')">Auto Optimize</button>
              <button class="btn" onclick="runQuick('/apply_env')">Apply Env</button>
            </div>
            <div class="btn-row" style="margin-top:10px">
              <button class="btn btn-primary" onclick="generateLatestEnv()">Generate latest.env</button>
              <button class="btn" onclick="downloadLatestEnv()">Download latest.env</button>
            </div>
            <div class="stats-grid">
              <div class="stat">
                <div class="stat-label">Trades</div>
                <div class="stat-value" id="envTradeCount">-</div>
              </div>
              <div class="stat">
                <div class="stat-label">Winrate</div>
                <div class="stat-value" id="envWinrate">-</div>
              </div>
              <div class="stat">
                <div class="stat-label">Avg PnL</div>
                <div class="stat-value" id="envAvgPnl">-</div>
              </div>
              <div class="stat">
                <div class="stat-label">Drawdown</div>
                <div class="stat-value" id="envDrawdown">-</div>
              </div>
            </div>
            <div style="margin-top:10px" class="section-title">LATEST ENV</div>
            <div id="envBlock" class="env-block">尚未生成 latest.env</div>
          </div>

          <div class="section">
            <div class="section-title">MARKETPLACE</div>
            <button class="btn" style="width:100%" onclick="refreshStore()">Load Store</button>
            <div id="storeList" style="margin-top:12px"></div>
          </div>

          <div id="pluginList"></div>
        </div>
      </section>

      <section class="panel panel-center">
        <div class="panel-head">
          <div class="panel-title">COMMAND TERMINAL</div>
          <div class="btn-row">
            <button class="btn" onclick="toggleMode()"><span id="modeLabel">Mode: Command</span></button>
            <button class="btn" onclick="appendHelp()">Help</button>
            <button class="btn" onclick="clearTerminal()">Clear</button>
          </div>
        </div>

        <div class="quick-actions">
          <button class="btn btn-primary" onclick="runQuick('/replay')">▶ Replay</button>
          <button class="btn" onclick="runQuick('/replay_opt')">🧠 Replay Optimize</button>
          <button class="btn" onclick="runQuick('/auto_opt')">⚡ Auto Optimize</button>
          <button class="btn" onclick="runQuick('/apply_env')">📦 Apply Env</button>
          <button class="btn" onclick="openSimModal()">📊 Simulate Order</button>
          <button class="btn" onclick="runQuick('/get_state')">📈 Get State</button>
          <button class="btn" onclick="runQuick('/wa_get_leaders')">🐋 Wallet Leaders</button>
        </div>

        <div class="terminal">
          <div id="terminalOutput" class="terminal-output"></div>

          <div class="terminal-input-wrap">
            <form onsubmit="submitInput(event)">
              <div class="terminal-bar">
                <span class="prompt" id="promptSymbol">&gt;</span>
                <input id="terminalInput" class="terminal-input" autocomplete="off" placeholder="輸入 /help、/skills、/start_v7_engine，或直接聊天..." />
                <button class="btn btn-primary" type="submit">Run</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="panel panel-right">
        <div class="panel-head">
          <div class="panel-title">LOGS</div>
          <button class="btn" onclick="clearLogs()">Clear</button>
        </div>
        <div class="panel-body">
          <div id="logsList" class="logs-list"></div>
        </div>
      </section>
    </main>

    <nav class="mobile-nav">
      <button onclick="focusInput()">Chat</button>
      <button onclick="runQuick('/replay')">Replay</button>
      <button onclick="runQuick('/auto_opt')">Optimize</button>
      <button class="run" onclick="focusInput()">Run</button>
    </nav>
  </div>

  <div id="simModal" class="modal">
    <div class="modal-card">
      <h3 style="color:var(--cyan);margin-top:0">Simulate Order</h3>
      <input id="simAsset" class="field" placeholder="asset_id" value="TEST" />
      <input id="simSide" class="field" placeholder="side (buy/sell)" value="buy" />
      <input id="simSize" class="field" placeholder="size" value="1" />
      <div class="btn-row">
        <button class="btn btn-primary" onclick="runSim()">Run Simulation</button>
        <button class="btn" onclick="closeSim()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      sessionId: "default",
      commandMode: true,
      plugins: [],
      store: [],
      logs: [],
      history: [],
      historyIndex: 0,
    };

    const terminalOutput = document.getElementById("terminalOutput");
    const terminalInput = document.getElementById("terminalInput");
    const pluginCount = document.getElementById("pluginCount");
    const sessionBadge = document.getElementById("sessionBadge");
    const modeLabel = document.getElementById("modeLabel");
    const promptSymbol = document.getElementById("promptSymbol");

    sessionBadge.textContent = state.sessionId;

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function now(){
      return new Date().toLocaleTimeString("zh-TW");
    }

    function addLog(text){
      state.logs.unshift({time: now(), text});
      state.logs = state.logs.slice(0, 200);
      renderLogs();
    }

    function renderLogs(){
      const html = state.logs.map(x => `
        <div class="log-row">
          <div class="time">[${esc(x.time)}]</div>
          <div class="text">${esc(x.text)}</div>
        </div>
      `).join("");
      document.getElementById("logsList").innerHTML = html || `<div class="text">No logs</div>`;
    }

    function clearLogs(){
      state.logs = [];
      renderLogs();
      addLog("logs cleared");
    }

    function appendTerminalLine(text, cls="info"){
      const div = document.createElement("div");
      div.className = `terminal-line ${cls}`;
      div.innerHTML = esc(text).replace(/\n/g, "<br>");
      terminalOutput.appendChild(div);
      terminalOutput.scrollTop = terminalOutput.scrollHeight;
    }

    function appendTerminalBlock(title, text){
      const div = document.createElement("div");
      div.className = "terminal-block";
      div.innerHTML = `
        <div class="terminal-line dim">${esc(title)}</div>
        <div class="terminal-line info">${esc(text).replace(/\n/g, "<br>")}</div>
      `;
      terminalOutput.appendChild(div);
      terminalOutput.scrollTop = terminalOutput.scrollHeight;
    }

    function clearTerminal(){
      terminalOutput.innerHTML = "";
      addLog("terminal cleared");
    }

    function appendHelp(){
      appendTerminalBlock("help", `/help
/skills
/providers
/store
/install <name> <url>
/enable <name>
/disable <name>
/remove <name>

/auto_opt
/apply_env
/replay
/replay_opt
/simulate_order {...}
/simulate_fill {...}

非 / 開頭會走 AI chat`);
    }

    function toggleMode(){
      state.commandMode = !state.commandMode;
      modeLabel.textContent = state.commandMode ? "Mode: Command" : "Mode: Chat";
      promptSymbol.textContent = state.commandMode ? ">" : "AI>";
      terminalInput.placeholder = state.commandMode
        ? "輸入 /help、/skills、/start_v7_engine..."
        : "直接問 AI...";
      addLog(`mode switched to ${state.commandMode ? "command" : "chat"}`);
    }

    async function refreshProviderStatus(){
      try{
        const res = await fetch("/api/status/providers");
        const data = await res.json();
        const p = data.providers || {};

        setProvider("claudeStatus", "Claude", p.claude);
        setProvider("openaiStatus", "GPT", p.openai);
        setProvider("tradingStatus", "Trading", p.trading_api);
      }catch(err){
        document.getElementById("claudeStatus").textContent = "Claude: error";
        document.getElementById("openaiStatus").textContent = "GPT: error";
        document.getElementById("tradingStatus").textContent = "Trading: error";
      }
    }

    function setProvider(id, label, item){
      const el = document.getElementById(id);
      const ok = !!item?.ok;
      el.className = `provider-pill ${ok ? "ok" : "err"}`;
      el.textContent = `${label}: ${item?.message || "unknown"}`;
    }

    async function refreshPlugins(){
      const res = await fetch("/api/plugins");
      const data = await res.json();
      state.plugins = data.plugins || [];
      pluginCount.textContent = state.plugins.filter(x => x.enabled).length;
      renderPlugins();
      addLog("plugins loaded");
    }

    function renderPlugins(){
      const html = state.plugins.map(p => `
        <div class="plugin-card">
          <div class="plugin-top">
            <div>
              <div class="plugin-name">${esc(p.name || p.id)}</div>
              <div class="plugin-desc">${esc(p.description || "")}</div>
            </div>
            <div class="badge ${p.enabled ? "" : "off"}">${p.enabled ? "ON" : "OFF"}</div>
          </div>
          <div class="chips">
            ${(p.tools || []).map(t => `<div class="chip">${esc(t)}</div>`).join("")}
          </div>
          <div class="plugin-actions">
            <button class="btn" onclick="togglePlugin('${esc(p.id)}')">${p.enabled ? "Disable" : "Enable"}</button>
            <button class="btn btn-danger" onclick="removePlugin('${esc(p.id)}')">Remove</button>
          </div>
        </div>
      `).join("");
      document.getElementById("pluginList").innerHTML = html || `<div class="section">No plugins</div>`;
    }

    async function togglePlugin(id){
      await fetch(`/api/plugins/${encodeURIComponent(id)}/toggle`, {method:"PATCH"});
      addLog(`toggle plugin ${id}`);
      await refreshPlugins();
    }

    async function removePlugin(id){
      if(!confirm(`Remove plugin ${id}?`)) return;
      await fetch(`/api/plugins/${encodeURIComponent(id)}`, {method:"DELETE"});
      addLog(`remove plugin ${id}`);
      await refreshPlugins();
    }

    async function installPluginFromUrl(){
      const name = document.getElementById("installName").value.trim();
      const url = document.getElementById("installUrl").value.trim();
      if(!name || !url){
        alert("請輸入 name 和 url");
        return;
      }

      await fetch("/api/plugins/install", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name, url})
      });
      addLog(`install plugin ${name}`);
      await refreshPlugins();
    }

    async function refreshStore(){
      const res = await fetch("/api/store");
      const data = await res.json();
      state.store = data.plugins || [];
      renderStore();
      addLog("store loaded");
    }

    function renderStore(){
      const html = state.store.map(p => `
        <div class="plugin-card">
          <div class="plugin-top">
            <div>
              <div class="plugin-name">${esc(p.name || p.id)}</div>
              <div class="plugin-desc">${esc(p.description || "")}</div>
            </div>
            <div class="badge">${p.installed ? "INSTALLED" : (p.price > 0 ? `$${p.price}` : "FREE")}</div>
          </div>
          <div class="plugin-actions">
            <button class="btn btn-primary" onclick="quickInstall('${esc(p.id)}','${esc(p.url || "")}')">
              ${p.installed ? "Reinstall" : "Install"}
            </button>
          </div>
        </div>
      `).join("");

      document.getElementById("storeList").innerHTML = html || `<div class="text">No store items</div>`;
    }

    async function quickInstall(id, url){
      await fetch("/api/plugins/install", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name:id, url})
      });
      addLog(`store install ${id}`);
      await refreshPlugins();
      await refreshStore();
    }

    async function submitInput(event){
      event.preventDefault();
      const text = terminalInput.value.trim();
      if(!text) return;

      state.history.push(text);
      state.historyIndex = state.history.length;

      appendTerminalLine(`> ${text}`, "cmd");
      terminalInput.value = "";

      let commandMode = state.commandMode || text.startsWith("/");

      if(commandMode){
        const res = await fetch("/api/command", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({command:text, session_id:state.sessionId})
        });
        const data = await res.json();

        if(data.output === "__CLEAR__"){
          clearTerminal();
          return;
        }

        appendTerminalBlock("command", data.output || "");
        addLog(`command: ${text}`);
      }else{
        const res = await fetch("/api/chat", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({message:text, session_id:state.sessionId, history:[]})
        });
        const data = await res.json();
        appendTerminalBlock(data.provider || "agent", data.response || "");
        addLog(`chat: ${text}`);
      }
    }

    async function runQuick(cmd){
      appendTerminalLine("> " + cmd, "cmd");

      const res = await fetch("/api/command", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          command: cmd,
          session_id: state.sessionId
        })
      });

      const data = await res.json();
      appendTerminalBlock("system", data.output || "");
      addLog(`quick: ${cmd}`);
    }

    async function generateLatestEnv(){
      try{
        const res = await fetch("/api/command", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({
            command: "/auto_opt"
          })
        });

        const data = await res.json();
        let output = data.output;

        if (typeof output === "string") {
          try { output = JSON.parse(output); } catch {}
        }

        if (!output || output.error) {
          addLog("generate latest.env failed");
          alert("Generate latest.env failed");
          return;
        }

        const stats = output.replay_stats || {};
        const envBlock = output.env_preview || "No env block";

        document.getElementById("envTradeCount").textContent = stats.executed ?? "-";
        document.getElementById("envWinrate").textContent =
          stats.winrate != null ? (stats.winrate * 100).toFixed(1) + "%" : "-";
        document.getElementById("envAvgPnl").textContent =
          output.best_score != null ? Number(output.best_score).toFixed(2) : "-";
        document.getElementById("envDrawdown").textContent =
          stats.drawdown != null ? Number(stats.drawdown).toFixed(4) : "-";

        document.getElementById("envBlock").textContent = envBlock;

        appendTerminalBlock("env optimizer", envBlock);
        addLog("latest.env generated");
      }catch(err){
        addLog("generate latest.env failed");
        alert("Generate failed: " + err);
      }
    }

    async function downloadLatestEnv(){
      try{
        const res = await fetch("/api/env/latest");

        if (!res.ok) {
          alert("latest.env not found，請先 Generate");
          return;
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "latest.env";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        addLog("latest.env downloaded");
      }catch(err){
        addLog("download latest.env failed");
        alert("Download failed: " + err);
      }
    }

    function openSimModal(){
      document.getElementById("simModal").style.display = "block";
    }

    function closeSim(){
      document.getElementById("simModal").style.display = "none";
    }

    async function runSim(){
      const asset = document.getElementById("simAsset").value;
      const side = document.getElementById("simSide").value;
      const size = parseFloat(document.getElementById("simSize").value || "1");

      const cmd = `/simulate_order ${JSON.stringify({
        asset_id: asset,
        side: side,
        size: size,
        book: {
          best_bid: 0.49,
          best_ask: 0.51,
          bids: [{price:0.49,size:10}],
          asks: [{price:0.51,size:10}]
        },
        order_type: "ioc"
      })}`;

      closeSim();
      runQuick(cmd);
    }

    terminalInput.addEventListener("keydown", (e)=>{
      if(e.key === "ArrowUp"){
        if(state.history.length === 0) return;
        e.preventDefault();
        state.historyIndex = Math.max(0, state.historyIndex - 1);
        terminalInput.value = state.history[state.historyIndex] || "";
      }
      if(e.key === "ArrowDown"){
        if(state.history.length === 0) return;
        e.preventDefault();
        state.historyIndex = Math.min(state.history.length, state.historyIndex + 1);
        terminalInput.value = state.history[state.historyIndex] || "";
      }
    });

    function focusInput(){
      terminalInput.focus();
    }

    async function bootstrap(){
      appendTerminalLine("AI Fund Control Panel ready.", "info");
      appendTerminalLine("Type /help to see available commands.", "dim");
      await refreshProviderStatus();
      await refreshPlugins();
      await refreshStore();
      renderLogs();
    }

    bootstrap();
  </script>
</body>
</html>
